<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Современный веб-калькулятор</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 text-white relative overflow-hidden">

        <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/30 rounded-full blur-3xl pointer-events-none"></div>

  
        <div class="flex justify-between items-center mb-6 relative z-10">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-red-500 rounded-full inline-block"></div>
                <div class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></div>
                <div class="w-3 h-3 bg-green-500 rounded-full inline-block"></div>
            </div>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Modular Calc v2.1</span>
        </div>

  
        <div class="mb-6 bg-black/40 border border-white/10 rounded-2xl p-4 text-right relative z-10 flex flex-col justify-end min-h-[110px] shadow-inner">
            <div id="history" class="text-xs sm:text-sm text-slate-400 h-6 overflow-x-auto whitespace-nowrap font-medium"></div>
            <div id="display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white overflow-x-auto whitespace-nowrap mt-1">0</div>
        </div>


        <div class="grid grid-cols-4 gap-3 sm:gap-4 relative z-10">
            
          
            <button onclick="clearAll()" class="btn-press col-span-1 py-3.5 sm:py-4 rounded-2xl bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 font-semibold text-lg transition duration-200 flex items-center justify-center">C</button>
            <button onclick="backspace()" class="btn-press col-span-1 py-3.5 sm:py-4 rounded-2xl bg-slate-700/40 hover:bg-slate-700/60 text-slate-200 border border-white/5 font-semibold text-lg transition duration-200 flex items-center justify-center" title="Удалить символ"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="appendOperator('%')" class="btn-press col-span-1 py-3.5 sm:py-4 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 font-semibold text-lg transition duration-200 flex items-center justify-center">%</button>
            <button onclick="appendOperator('÷')" class="btn-press col-span-1 py-3.5 sm:py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center">÷</button>

   
            <button onclick="appendNumber('7')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">7</button>
            <button onclick="appendNumber('8')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">8</button>
            <button onclick="appendNumber('9')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">9</button>
            <button onclick="appendOperator('×')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center">×</button>


            <button onclick="appendNumber('4')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">4</button>
            <button onclick="appendNumber('5')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">5</button>
            <button onclick="appendNumber('6')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">6</button>
            <button onclick="appendOperator('−')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center">−</button>

   
            <button onclick="appendNumber('1')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">1</button>
            <button onclick="appendNumber('2')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">2</button>
            <button onclick="appendNumber('3')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">3</button>
            <button onclick="appendOperator('+')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center">+</button>

      
            <button onclick="appendNumber('0')" class="btn-press col-span-2 py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">0</button>
            <button onclick="appendDecimal('.')" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-semibold text-lg transition duration-200">.</button>
            <button onclick="calculate()" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-lg shadow-lg shadow-emerald-600/30 transition duration-200 flex items-center justify-center">=</button>

        </div>

    </div>


    <script src="javascript.js"></script>
</body>
</html>
